[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mri-classification"
version = "0.1.0"
description = "MRI brain image preprocessing, EDA, training, and inference toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "mozybali" }
]
dependencies = [
  "numpy>=1.21.0,<2.3",
  "pandas>=1.3.0",
  "scipy>=1.7.0",
  "Pillow>=9.0.0",
  "opencv-python>=4.5.0",
  "scikit-image>=0.19.0",
  "SimpleITK>=2.0.0",
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "scikit-learn==1.4.2",
  "matplotlib>=3.4.0",
  "seaborn>=0.11.0",
  "tqdm>=4.62.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
]

[project.scripts]
mri-train = "model.train:main"
mri-infer = "model.inference:main"
mri-preprocess = "goruntu_isleme.ana_islem:main"
mri-eda = "eda_analiz.eda_calistir:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["model*", "goruntu_isleme*", "eda_analiz*"]

[tool.coverage.run]
source = ["goruntu_isleme", "model", "eda_analiz"]
omit = [
  "*/tests/*",
  "*/test_*.py",
  "*/__pycache__/*",
  "*/venv/*",
  "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"
