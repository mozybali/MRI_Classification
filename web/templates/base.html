{% load static %}
<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{% block meta_description %}MRI Beyin Görüntüsü Sınıflandırma — Demans seviyesi tespiti için yapay zeka destekli analiz platformu{% endblock %}">
  <title>{% block title %}MRI Sınıflandırma{% endblock %} | NeuroScan AI</title>

  <!-- CSS -->
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>

<!-- ── Navbar ─────────────────────────────────────────────────── -->
<nav class="navbar" role="navigation" aria-label="Ana navigasyon">
  <a href="{% url 'infer:index' %}" class="navbar-brand" id="navbar-brand">
    <div class="brand-icon" aria-hidden="true">🧠</div>
    <span>NeuroScan AI</span>
  </a>

  <ul class="navbar-nav" role="list">
    <li>
      <a href="{% url 'infer:index' %}"
         class="nav-link {% if request.resolver_match.namespace == 'infer' %}active{% endif %}"
         id="nav-inference"
         aria-current="{% if request.resolver_match.namespace == 'infer' %}page{% endif %}">
        <span aria-hidden="true">⚡</span>
        <span class="label">Tahmin</span>
      </a>
    </li>
    <li>
      <a href="{% url 'infer:history' %}"
         class="nav-link {% if request.resolver_match.url_name == 'history' %}active{% endif %}"
         id="nav-history">
        <span aria-hidden="true">🕐</span>
        <span class="label">Geçmiş</span>
      </a>
    </li>
    <li>
      <a href="{% url 'dashboard:index' %}"
         class="nav-link {% if request.resolver_match.namespace == 'dashboard' %}active{% endif %}"
         id="nav-dashboard"
         aria-current="{% if request.resolver_match.namespace == 'dashboard' %}page{% endif %}">
        <span aria-hidden="true">📊</span>
        <span class="label">Dashboard</span>
      </a>
    </li>
  </ul>
</nav>

<!-- ── Ana İçerik ─────────────────────────────────────────────── -->
<main id="main-content">
  {% block content %}{% endblock %}
</main>

<!-- ── Toast Container ────────────────────────────────────────── -->
<div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

<!-- ── JavaScript ─────────────────────────────────────────────── -->
<script src="{% static 'js/toast.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
